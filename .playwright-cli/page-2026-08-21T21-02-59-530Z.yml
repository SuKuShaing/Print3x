      - generic [ref=e118]:
        - img "Entrega de premios del despega usach por parte de Sebastián Sanhueza Tapia Print3x printex printec print3c" [ref=e122]
        - generic [ref=e124]:
          - paragraph [ref=e125]: "2017"
          - heading "Entrega de Premios de la nueva version del despega usach" [level=2] [ref=e126]
          - paragraph [ref=e128]: Al haber sido ganadores de la versión anterior se nos invito a contar las experiencias de nuestros emprendimientos a las nuevas generaciones de emprendedores de la Universidad de Santiago de Chile. En esa versión Sebastián contaba la historia de Crea en 3D (actualmente Print3x) y los aprendizajes obtenidos en Stanford.
      - generic [ref=e131]:
        - img "Print3x Ganadores de la competencia de emprendedores en Conrad Waterloo Print3x printex printec print3c" [ref=e135]
        - generic [ref=e137]:
