          - heading "Ganadores en Waterloo University" [level=2] [ref=e139]
          - generic [ref=e140]:
            - paragraph [ref=e141]: Al ya haber ganado varios concursos, la Usach nos beco para ir a competir a la aceleradora de negocios de Conrad, en la universidad de Waterloo, Ontario, Canada. Y ¿qué creen? Ganamos el primer lugar frente a más de 50 proyectos internacionales y el apoyo de los inversionistas especializados.
