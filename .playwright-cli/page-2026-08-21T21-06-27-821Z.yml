      - generic [ref=f2e118]:
        - img "Entrega de premios del despega usach por parte de Sebastián Sanhueza Tapia Print3x printex printec print3c" [ref=f2e122]
        - generic [ref=f2e124]:
          - paragraph [ref=f2e125]: "2017"
          - heading "Entrega de Premios de la nueva version del despega usach" [level=2] [ref=f2e126]
          - paragraph [ref=f2e128]: Al haber sido ganadores de la versión anterior se nos invito a contar las experiencias de nuestros emprendimientos a las nuevas generaciones de emprendedores de la Universidad de Santiago de Chile. En esa versión Sebastián contaba la historia de Crea en 3D (actualmente Print3x) y los aprendizajes obtenidos en Stanford.
      - generic [ref=f2e131]:
        - img "Print3x Ganadores de la competencia de emprendedores en Conrad Waterloo Print3x printex printec print3c" [ref=f2e135]
        - generic [ref=f2e137]:
          - paragraph [ref=f2e138]: "2018"
          - heading "Ganadores en Waterloo University" [level=2] [ref=f2e139]
          - generic [ref=f2e140]:
            - paragraph [ref=f2e141]: Al ya haber ganado varios concursos, la Usach nos beco para ir a competir a la aceleradora de negocios de Conrad, en la universidad de Waterloo, Ontario, Canada. Y ¿qué creen? Ganamos el primer lugar frente a más de 50 proyectos internacionales y el apoyo de los inversionistas especializados.
            - paragraph [ref=f2e142]: En el siguiente video se muestra cuando van a dar los ganadores del concuro.
