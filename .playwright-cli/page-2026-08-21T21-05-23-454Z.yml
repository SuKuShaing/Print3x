        - generic [ref=f1e75]:
          - paragraph [ref=f1e76]: "2015"
          - heading "Ganadores del Despega Usach" [level=2] [ref=f1e77]
          - generic [ref=f1e78]:
            - paragraph [ref=f1e79]: En esta imagen se muestra al equipo de Crea en 3D (el nombre anterior de la empresa Print3x) cuando reciben el premio por ser uno de los 5 ganadores del concurso de emprendimiento de la universidad.
            - paragraph [ref=f1e80]: Miembros de Crea en 3D, de izquierda a derecha, Sebastián Sanhueza, Presentadora, Denis Ogaz, Christopher Casares, Gerson Molina (No está en la foto)
      - generic [ref=f1e83]:
        - img "Entrega de certificados a Sebastián Sanhueza Tapia en Standford University por parte de Phillip y Bob | Print3x printex printec print3c" [ref=f1e87]
        - generic [ref=f1e89]:
          - paragraph [ref=f1e90]: "2016"
          - heading "Entrega de certificados Stanford" [level=2] [ref=f1e91]
          - paragraph [ref=f1e93]: Una vez finalizado el curso y concurso nos entregaron los certificados. Se hizo una ronda de inversión, a pesar de no haber conseguido inversión en las rondas de financiamiento, si estuvimos en el podio de los finalistas.
      - generic [ref=f1e96]:
        - img "Aparición en la prensa de los ganadores del despega Usach Print3x printex printec print3c" [ref=f1e100]
        - generic [ref=f1e102]:
          - paragraph [ref=f1e103]: "2016"
          - heading "Vuelta a Chile" [level=2] [ref=f1e104]
          - paragraph [ref=f1e106]: Al volver a Chile tuvimos unas serie de entrevista por la pasantía en Stanford y la vida del emprendimiento en Silicon Valley, además de que tuvimos las casualidad de que el Gerente de innovación de Corfo Tadashi Takaoka estaba en el área, y gracias a los profesores nos juntaron para tener la experiencia de las serendipias del valle del silicio y él también estuvo en la ronda de opinión de los proyectos de los chilenos.
      - generic [ref=f1e108]:
        - heading "Entrevista a Sebastián Sanhueza en la construcción de la Axis One" [level=2] [ref=f1e110]
        - generic "Entrevista a Sebastián Sanhueza en la construcción de la Axis One" [ref=f1e111] [cursor=pointer]:
