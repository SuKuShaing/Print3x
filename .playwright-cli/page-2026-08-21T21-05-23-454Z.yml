        - generic [ref=f1e52]:
          - paragraph [ref=f1e53]: "2014"
          - heading "Primera Impresora" [level=2] [ref=f1e54]
          - generic [ref=f1e55]:
            - paragraph [ref=f1e56]: Muestra de la primera impresora 3D hecha en la Universidad de Santiago de chile, la impresora 3D que acompaña a Sebastian Sanhueza es la primera versión de varias que le continuaron.
            - paragraph [ref=f1e57]: Esto fue presentado en el congreso de Biotecnologia del 2014, Usach.
      - generic [ref=f1e59]:
        - heading "Aparición de Crea en 3D (después se llamaría Print3x) en Mini Documental sobre impresión 3D en Chile" [level=2] [ref=f1e61]
